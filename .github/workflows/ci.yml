name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit version
        run: moon version
      - name: Update MoonBit registry index
        run: moon update
      - name: Format check
        run: moon fmt --check
      - name: Public interface check
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti
      - name: Check
        run: moon check --deny-warn
      - name: Build
        run: moon build
      - name: Test
        run: moon test --deny-warn
      - name: Test all targets
        run: moon test --target all
